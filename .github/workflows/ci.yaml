# GitHub Actions CI workflow
#
# Runs the test_pipeline.py suite (data_ingestion.py + data_preprocessing.py)
# on every push / PR. Save this file as: .github/workflows/ci.yaml
#
# It does NOT require params.yaml, a real Census .xls file, or real
# logger.py / exception.py modules — the tests either mock those out
# or fall back to lightweight stubs.

name: CI - Pipeline Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pyyaml
          # Pull in any project-declared dependencies too, if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run test suite
        run: pytest test_pipeline.py -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
