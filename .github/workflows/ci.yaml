# GitHub Actions CI workflow
#
# Runs the test_pipeline.py suite (data_ingestion.py + data_preprocessing.py)
# on every push / PR. Save this file as: .github/workflows/ci.yaml
#
# Requirements:
#   - test_pipeline.py, data_ingestion.py, data_preprocessing.py must be
#     committed to the repo (this workflow does not create them).
#   - No requirements.txt is required; core deps are installed directly.
#     If you DO have a requirements.txt, it will be picked up automatically.

name: CI - Pipeline Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # no "cache: pip" here -- it errors out when there's no
          # requirements.txt/pyproject.toml lockfile to key the cache on

      - name: Show repo contents (debug)
        run: |
          echo "Working directory: $(pwd)"
          find . -maxdepth 2 -type f \( -name "*.py" -o -name "requirements.txt" \)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pyyaml
          if [ -f requirements.txt ]; then
            echo "Found requirements.txt, installing it too"
            pip install -r requirements.txt
          fi

      - name: Verify test file exists
        run: |
          if [ ! -f test_pipeline.py ]; then
            echo "::error::test_pipeline.py not found in repo root. Make sure it's committed."
            exit 1
          fi

      - name: Run test suite
        run: pytest test_pipeline.py -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore